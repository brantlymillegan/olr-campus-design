<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script>
    if (window.top === window) {
      location.replace(new URL('../?view=3d', location.href).href);
    } else {
      try {
        const saved = localStorage.getItem('olr-campus-theme');
        const preference = ['light', 'dark', 'system'].includes(saved) ? saved : 'system';
        document.documentElement.dataset.theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
      } catch {}
    }
  </script>
  <title>3D campus · Our Lady of the Rosary</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./viewer.css?v=a0e0df8554bc5ed9">
  <link rel="stylesheet" href="./campus-walk.css?v=85db65d864bc69af">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <main id="viewer" aria-label="New campus exterior model">
    <div id="canvas-wrap"></div>
    <div class="loading panel" id="loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="loading-text">Preparing your campus…</span></div>
    <div class="error panel" id="error" hidden role="alert"><strong>The interactive campus model could not load.</strong><p>Try loading the 3D campus again.</p><button id="retry" type="button">Try again</button></div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><div class="error panel">The 3D campus needs JavaScript. <a href="../?view=3d" target="_top">Open the campus app</a>.</div></noscript>
  </main>
  <script type="module" src="./viewer.js?v=97a66a019a0e692b"></script>
</body>
</html>
